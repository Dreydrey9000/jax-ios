name: Jax
options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  JaxWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JAX_BUNDLE_ID).watchkitapp
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Jax
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(JAX_BUNDLE_ID)
  Jax:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    # The watch app rides inside the phone app. Building it needs the watchOS
    # simulator runtime once: `xcodebuild -downloadPlatform watchOS`.
    dependencies:
      - target: JaxWatch
    # Custom keys merged into the generated Info.plist. Values come from Config/*.xcconfig.
    info:
      path: Config/Jax-Info.plist
      properties:
        JaxServerURL: $(JAX_SERVER_URL)
        JaxTextNumber: $(JAX_TEXT_NUMBER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JAX_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jax
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Jax listens to your voice so you can talk to it.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Jax turns what you say into text so it can answer you.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
